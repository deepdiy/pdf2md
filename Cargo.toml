[package]
name = "pdf2md_ncnn_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
image = "0.25"
mupdf = { version = "0.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
